<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>رفيق القرآن - المراجعة الذكية</title>

<!-- إعدادات الأيقونات (Favicon & PWA) المحددة -->
<link rel="icon" type="image/png" href="logo.png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1b16;--card-bg:#16241c;--border:#2a3d30;--text:#e8e6df;--primary:#c9a86a;--secondary:#9aa89a;--danger:#7f5a5a;--input-bg:#0a120f;--success:#4caf50;--warning:#ff9800;--info:#2196f3;}
[data-theme="light"]{--bg:#f4f6f5;--card-bg:#fff;--border:#d1d8d3;--text:#2c3e35;--primary:#8b6d33;--secondary:#5c6b61;--danger:#b33939;--input-bg:#eef1f0;--success:#388e3c;--warning:#f57c00;--info:#1976d2;}
body.lite-mode *{transition:none!important;box-shadow:none!important;background-image:none!important}
*{box-sizing:border-box;transition:background .3s,color .3s}
body{font-family:Tahoma,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:0 0 80px;line-height:1.6}
.quran-font{font-family:'Amiri',serif;font-size:19px!important;font-weight:700}
.wrap{max-width:640px;margin:0 auto;padding:16px}.view{display:none;animation:fadeIn .3s}.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:22px;color:var(--primary);margin:0;font-family:'Amiri',serif}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 4px 66rgba(0,0,0,.1)}
.card h2{font-size:16px;margin:0 0 12px;color:var(--primary);display:flex;align-items:center;gap:6px}.badge-count{background:var(--border);color:var(--secondary);font-size:12px;padding:2px 10px;border-radius:12px;margin-inline-start:auto;font-weight:700}
input[type=text],input[type=number],textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;margin-bottom:10px;font-family:Tahoma,sans-serif}
button.main-btn{width:100%;padding:14px;border-radius:10px;border:0;background:var(--primary);color:#0f1b16;font-weight:700;font-size:16px;cursor:pointer}button.huge-btn{padding:18px;font-size:18px;background:linear-gradient(135deg,var(--primary),#a6854b);box-shadow:0 4px 15px rgba(201,168,106,.2);margin:10px 0}
button:active{transform:scale(.98)}.action-btn{flex:1;background:var(--border);color:var(--text);text-align:center;padding:12px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;border:0}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:var(--card-bg);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0;z-index:1000;box-shadow:0 -2px 10px rgba(0,0,0,.2)}
.nav-item{flex:1;text-align:center;color:var(--secondary);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}.nav-item.active{color:var(--primary);font-weight:700}.nav-icon{font-size:22px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,27,22,.95);z-index:2000;align-items:center;justify-content:center;padding:16px}.modal-content{background:var(--card-bg);border:1px solid var(--primary);width:100%;max-width:400px;border-radius:16px;padding:24px;position:relative;max-height:85vh;overflow-y:auto}.close-modal{position:absolute;top:10px;left:15px;background:none;border:0;color:var(--danger);font-size:22px;cursor:pointer}
.item{display:flex;flex-direction:column;gap:8px;padding:14px;border-bottom:1px solid var(--border);font-size:14px;background:var(--input-bg);border-radius:10px;margin-bottom:10px;border-right:3px solid transparent}.item.icu{border-right-color:var(--danger);background:rgba(244,67,54,.05)}.item.due-review{border-right-color:var(--warning);background:rgba(255,152,0,.05)}
.item-header{display:flex;justify-content:space-between;align-items:flex-start}.item-title{flex:1}.item-meta{font-size:11px;color:var(--secondary);margin-top:6px;display:flex;justify-content:space-between;align-items:center}.app-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.app-links a{text-decoration:none;color:var(--secondary);border:1px solid var(--border);padding:4px 8px;border-radius:6px;font-size:11px;background:var(--card-bg)}
.rep-counter-container{display:flex;flex-direction:column;gap:8px;background:var(--card-bg);padding:10px;border-radius:8px;border:1px dashed var(--border);margin-top:5px}.rep-counter-row{display:flex;justify-content:space-between;align-items:center}.rep-btn{background:var(--primary);color:#0f1b16;border:0;padding:8px 16px;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px}.rep-btn.done{background:var(--success);color:#fff}
.q-btns{display:grid;gap:6px;margin-top:10px;width:100%}.q-btns button{padding:10px 4px;font-size:12px;font-weight:700;border-radius:6px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);cursor:pointer}
.phase-tracker{display:flex;gap:4px;margin-top:6px}.t-box{width:14px;height:14px;border:1px solid var(--primary);border-radius:3px;background:transparent}.t-box.done{background:var(--primary)}
.timer-display{font-size:48px;font-weight:700;color:var(--primary);text-align:center;font-family:monospace;margin:10px 0;letter-spacing:2px}body.focus-mode .bottom-nav,body.focus-mode .header-row,body.focus-mode #home-content{display:none!important}#session-container{display:none}body.focus-mode #session-container{display:flex;flex-direction:column;justify-content:center;min-height:80vh}
.stats-grid{display:flex;text-align:center;justify-content:space-between;margin-bottom:16px;gap:8px}.stat-box{flex:1;background:var(--input-bg);padding:12px 0;border-radius:10px;border:1px solid var(--border)}.stat-num{font-size:22px;font-weight:700;color:var(--primary)}.stat-lbl{font-size:11px;color:var(--secondary);margin-top:4px}
.progress-bar-container{background:var(--input-bg);border-radius:10px;height:14px;width:100%;overflow:hidden;margin:10px 0;border:1px solid var(--border)}.progress-bar{background:var(--primary);height:100%;width:0%;transition:width .5s ease}
.empty-state{text-align:center;padding:20px;font-size:13px;line-height:1.8;color:var(--secondary);background:rgba(201,168,106,.05);border:1px dashed var(--border);border-radius:10px}.empty-state b{color:var(--primary)}.phase-badge{background:rgba(201,168,106,.1);border:1px solid var(--primary);color:var(--primary);font-size:10px;padding:2px 8px;border-radius:12px;margin-right:6px;display:inline-block}
</style>
</head>
<body>
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchTab('view-home',this)"><div class="nav-icon">📅</div>خطة اليوم</div>
  <div class="nav-item" onclick="switchTab('view-pool',this)"><div class="nav-icon">📚</div>المخزون</div>
  <div class="nav-item" onclick="switchTab('view-spiritual',this)"><div class="nav-icon">📊</div>التقدم والأثر</div>
  <div class="nav-item" onclick="switchTab('view-settings',this)"><div class="nav-icon">⚙️</div>الإعدادات</div>
</div>

<div class="wrap">
  <div id="view-home" class="view active">
    <!-- محتوى الصفحة الرئيسية -->
  </div>
  <div id="view-pool" class="view">
    <!-- محتوى المخزون -->
  </div>
  <div id="view-spiritual" class="view">
    <!-- محتوى التقدم -->
  </div>
  <div id="view-settings" class="view">
    <!-- محتوى الإعدادات -->
  </div>
</div>

<script>
// الكود البرمجي (جافا سكريبت)
</script>
</body>
</html>

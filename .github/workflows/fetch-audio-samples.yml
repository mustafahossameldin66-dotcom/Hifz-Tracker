name: fetch-audio-samples
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/pwa-complete

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Prepare output directories
        run: |
          mkdir -p public/audio

      - name: Run fetch script
        env:
          DOWNLOAD_LIMIT: 5
        run: |
          chmod +x scripts/fetch_audio.sh
          ./scripts/fetch_audio.sh

      - name: Commit and push audio samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio || true
          if git diff --staged --quiet; then
            echo "No audio files were added"
          else
            git commit -m "chore: add audio sample files (first $DOWNLOAD_LIMIT) for selected readers"
            # زيادة buffers ومحاولة push مع إعادة المحاولة 3 مرات
            git config --global http.postBuffer 524288000
            git config --global http.lowSpeedLimit 0
            git config --global http.lowSpeedTime 999999
            n=0
            until [ $n -ge 3 ]
            do
              git push origin HEAD:feature/pwa-complete && break
              n=$((n+1))
              echo "Push failed, retrying ($n)..."
              sleep 5
            done
            if [ $n -ge 3 ]; then
              echo "Push failed after retries" >&2
              exit 1
            fi
          fi

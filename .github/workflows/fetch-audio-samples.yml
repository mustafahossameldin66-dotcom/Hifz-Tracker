name: fetch-audio-samples
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/pwa-complete

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl python3

      - name: Prepare output directories
        run: |
          mkdir -p public/audio

      - name: Run fetch script
        env:
          DOWNLOAD_LIMIT: 5
        run: |
          chmod +x scripts/fetch_audio.sh
          ./scripts/fetch_audio.sh

      - name: Upload audio as artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-samples
          path: public/audio
